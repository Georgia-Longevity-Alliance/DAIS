[package]
name = "dais-core"
version = "0.1.0"
edition = "2021"
description = "DAIS — Autonomous Intelligence Socket: protocol core for safe embodied AI"
license = "Apache-2.0"

[lib]
name = "dais_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
ringbuf = "0.5"
ed25519-dalek = "2"
hex = "0.4"
